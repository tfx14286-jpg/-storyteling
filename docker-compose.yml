services:
  storyteling:
    build: .
    image: storyteling:latest
    container_name: storyteling
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      # Path absolut di dalam volume /data agar DB + file tetap ada saat restart.
      - DATABASE_URL=file:/data/app.db
      - STORAGE_LOCAL_PATH=/data/storage
      - STORAGE_PROVIDER=local

      # Mode AI. "mock" menjalankan seluruh pipeline secara lokal tanpa kunci API.
      - AI_MODE=${AI_MODE:-mock}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - IMAGE_PROVIDER=${IMAGE_PROVIDER:-mock}
      - VIDEO_PROVIDER=${VIDEO_PROVIDER:-mock}
      # Container Linux tidak punya mesin suara Windows — gunakan mock kecuali TTS asli dikonfigurasi.
      - TTS_PROVIDER=${TTS_PROVIDER:-mock}
      - MUSIC_PROVIDER=${MUSIC_PROVIDER:-mock}

      # Secret yang wajib diisi (atur di .env — lihat .env.docker.example)
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET di .env}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY di .env}

      # Provider live opsional — biarkan kosong untuk tetap memakai mock.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_LLM_MODEL=${OPENAI_LLM_MODEL:-gpt-4o-mini}
      - IMAGE_API_KEY=${IMAGE_API_KEY:-}
      - IMAGE_BASE_URL=${IMAGE_BASE_URL:-}
      - IMAGE_MODEL=${IMAGE_MODEL:-}
      - VIDEO_API_KEY=${VIDEO_API_KEY:-}
      - VIDEO_BASE_URL=${VIDEO_BASE_URL:-}
      - VIDEO_MODEL=${VIDEO_MODEL:-}
      - OPENAI_TTS_KEY=${OPENAI_TTS_KEY:-}
      - OPENAI_TTS_MODEL=${OPENAI_TTS_MODEL:-gpt-4o-mini-tts}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID:-}
    volumes:
      - storyteling_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  storyteling_data:
